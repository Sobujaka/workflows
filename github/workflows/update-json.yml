name: Auto Update Live TV JSON

on:
  schedule:
    # প্রতি ৬ মিনিট পর পর অটোমেটিক রান হবে
    - cron: '*/6 * * * *'
  workflow_dispatch: # এই লাইনের কারণে আপনি ম্যানুয়ালি Actions ট্যাব থেকে বাটন চেপেও আপডেট করতে পারবেন

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Download latest live-tv.json
        run: |
          curl -s "https://spring-voice-2488.jahangir339932.workers.dev/" -o live-tv.json

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add live-tv.json
          
          # ডাটাতে পরিবর্তন থাকলে তবেই Commit করবে
          if git diff --staged --quiet; then
            echo "No changes found in live-tv.json."
          else
            git commit -m "Auto-update live-tv.json from Worker [skip ci]"
            git push
          fi
