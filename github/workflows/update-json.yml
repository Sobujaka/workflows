name: Auto Update LIVE-TV.JSON

on:
  schedule:
    # প্রতি ৬ মিনিট পরপর চালানোর জন্য Cron Expression
    - cron: '*/6 * * * *'
  workflow_dispatch: # চাইলে ব্যাকএন্ড থেকে ম্যানুয়ালি রান করার জন্য

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # ১. রিポジটরি ক্লোন/চেকআউট করা
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. Worker থেকে ডাটা ফেচ করে LIVE-TV.JSON ফাইলে সেভ করা
      - name: Fetch JSON from Cloudflare Worker
        run: |
          curl -s "https://spring-voice-2488.jahangir339932.workers.dev/" -o LIVE-TV.JSON

      # ৩. ফাইলের কোনো পরিবর্তন হয়েছে কিনা তা চেক করা এবং GitHub-এ Commit/Push করা
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add LIVE-TV.JSON
          
          # যদি ফাইলে পরিবর্তন থাকে তবেই commit করবে
          if git diff --staged --quiet; then
            echo "No changes detected in LIVE-TV.JSON."
          else
            git commit -m "Auto update LIVE-TV.JSON [Skip CI]"
            git push
          fi
