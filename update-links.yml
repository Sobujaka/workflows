name: Daily Link Auto Update

on:
  schedule:
    # প্রতিদিন বাংলাদেশ সময় সকাল ৬টায় (UTC রাত ১২টায়) অটোমেটিক রান হবে
    - cron: '0 0 * * *'
  workflow_dispatch: // আপনি চাইলে ম্যানুয়ালিও বাটন চাপ Run করতে পারবেন

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Modify Links File
        run: |
          # এখানে আপনার ফাইলের লিংক আপডেট করার কমান্ড বা স্ক্রিপ্ট থাকবে
          # যেমন: আপনি চাইলে একটি পাইথন বা নোড স্ক্রিপ্ট চালিয়ে ডেটা বদলাতে পারেন
          echo "Updating links at $(date)" >> update-log.txt

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update daily stream links"
          branch: main
