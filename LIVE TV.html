<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M3U to JSON Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e1e;
      color: #fff;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h2 {
      color: #007acc;
    }
    .input-group {
      margin-bottom: 20px;
    }
    input[type="file"] {
      background: #2d2d2d;
      color: #fff;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: pointer;
    }
    textarea {
      width: 100%;
      height: 400px;
      background: #252526;
      color: #9cdcfe;
      border: 1px solid #3c3c3c;
      border-radius: 4px;
      padding: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      box-sizing: border-box;
      resize: vertical;
    }
    .btn {
      background: #0e639c;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover {
      background: #1177bb;
    }
  </style>
</head>
<body>

  <h2>M3U to JSON Converter</h2>
  
  <div class="input-group">
    <input type="file" id="m3uFileInput" accept=".m3u, .m3u8, .txt">
  </div>

  <textarea id="jsonOutput" placeholder="M3U ফাইল আপলোড করলে এখানে JSON আউটপুট দেখা যাবে..." readonly></textarea>
  <br>
  <button class="btn" onclick="copyJSON()">JSON কপি করুন</button>

  <script>
    document.getElementById('m3uFileInput').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const content = e.target.result;
        const jsonResult = parseM3UToJSON(content);
        document.getElementById('jsonOutput').value = JSON.stringify(jsonResult, null, 2);
      };
      reader.readAsText(file);
    });

    function parseM3UToJSON(m3uText) {
      const lines = m3uText.split(/\r?\n/);
      const result = {};

      let currentName = "";
      let currentLogo = "";
      let currentGroup = "";

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();

        if (line.startsWith("#EXTINF:")) {
          // Extract tvg-logo
          const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
          currentLogo = logoMatch ? logoMatch[1] : "";

          // Extract group-title
          const groupMatch = line.match(/group-title="([^"]*)"/i);
          currentGroup = groupMatch ? groupMatch[1] : "";

          // Extract Channel Name (after comma)
          const nameMatch = line.split(',');
          currentName = nameMatch.length > 1 ? nameMatch.slice(1).join(',').trim() : "channel";

        } else if (line.length > 0 && !line.startsWith("#")) {
          // Stream URL line
          const streamUrl = line;

          // Object key তৈরির জন্য Channel Name ক্লিন করা (lowercase & underscores)
          let keyName = currentName.toLowerCase()
                                   .replace(/[^a-z0-9]/g, '_')
                                   .replace(/_+/g, '_')
                                   .replace(/^_+|_+$/g, '');

          if (!keyName) {
            keyName = "channel_" + Math.random().toString(36).substring(2, 7);
          }

          // অবজেক্টে ডাটা সেট করা
          result[keyName] = {
            "name": currentName,
            "tvglogo": currentLogo,
            "group": currentGroup,
            "url": streamUrl
          };

          // রিসেট ভ্যারিয়েবল
          currentName = "";
          currentLogo = "";
          currentGroup = "";
        }
      }

      return result;
    }

    function copyJSON() {
      const textOutput = document.getElementById('jsonOutput');
      if (!textOutput.value) return;
      textOutput.select();
      document.execCommand('copy');
      alert('JSON ডাটা ক্লিপবোর্ডে কপি হয়েছে!');
    }
  </script>

</body>
</html>
