<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Smart Video Player & Editable Code Extractor</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b1120; color: #ffffff; padding: 20px; }
        
        .tester-container {
            background-color: #161e2e;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto 25px auto;
        }

        .tester-container h2 { font-size: 18px; margin-bottom: 10px; color: #3b82f6; }
        .tester-container textarea {
            width: 100%;
            height: 200px;
            background-color: #0f172a;
            border: 1px solid #1f2937;
            border-radius: 6px;
            color: #38bdf8;
            font-family: monospace;
            padding: 12px;
            font-size: 13px;
            outline: none;
            resize: vertical;
        }

        .tester-container button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            font-size: 15px;
            transition: background 0.2s;
        }

        .tester-container button:hover { background-color: #2563eb; }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .card {
            background-color: #161e2e;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #1f2937;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover { transform: translateY(-5px); border-color: #3b82f6; }
        .card-image-wrapper { width: 100%; aspect-ratio: 2 / 3; background-color: #0f172a; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 10px; }
        .card-title { font-size: 13px; font-weight: 600; color: #f8fafc; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 36px; }

        #player-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0b1120;
            z-index: 9999;
            padding: 20px;
            overflow-y: auto;
        }

        .player-container {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1f2937;
        }

        .player-main { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
        .player-title { font-size: 18px; font-weight: 600; color: #3b82f6; }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .video-wrapper iframe, .video-wrapper video { width: 100%; height: 100%; border: none; }

        .active-code-box {
            margin-top: 15px;
            background: #161e2e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1f2937;
        }

        .active-code-box h3 { font-size: 14px; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .active-code-box textarea {
            width: 100%;
            height: 180px;
            background-color: #0f172a;
            border: 1px solid #3b82f6;
            border-radius: 6px;
            color: #10b981;
            font-family: monospace;
            padding: 10px;
            font-size: 12px;
            outline: none;
            resize: vertical;
        }

        .copy-btn {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .copy-btn:hover { background: #059669; }

        .player-sidebar-wrapper { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
        .back-btn { background: #ef4444; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .episodes-grid { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 450px; overflow-y: auto; }
        .ep-btn { background: #161e2e; border: 1px solid #1f2937; color: #fff; padding: 10px; font-size: 12px; border-radius: 4px; cursor: pointer; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ep-btn.active, .ep-btn:hover { background: #3b82f6; border-color: #3b82f6; }

        @media (max-width: 800px) {
            .player-container { flex-direction: column; }
            .player-sidebar-wrapper { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="home-view">
        <div class="tester-container">
            <h2>Universal JSON Code Tester</h2>
            <textarea id="jsonInput" placeholder="এখানে আপনার JSON পেস্ট করুন..."></textarea>
            <button onclick="processTestCode()">Load Content</button>
        </div>
        <div id="main-content"></div>
    </div>

    <!-- Player View -->
    <div id="player-view">
        <div class="player-container">
            <div class="player-main">
                <h2 id="videoTitle" class="player-title">Streaming Video</h2>
                <div class="video-wrapper">
                    <iframe id="iframePlayer" src="" allowfullscreen style="display:none;"></iframe>
                    <video id="html5Player" controls style="display:none;"></video>
                </div>

                <div class="active-code-box">
                    <h3>
                        <span>Edit & Copy JSON Code:</span>
                        <button class="copy-btn" onclick="copyCurrentCode()">Copy Edited Code</button>
                    </h3>
                    <textarea id="currentCodeBox" placeholder="এখানে কোড প্রদর্শিত হবে এবং আপনি ইচ্ছেমতো এডিট করতে পারবেন..."></textarea>
                </div>
            </div>

            <div class="player-sidebar-wrapper">
                <button class="back-btn" onclick="closePlayerPage()">← Back to Home</button>
                <div id="playerSidebar"></div>
            </div>
        </div>
    </div>

    <script>
        let hlsPlayer = null;
        let lastScrollPosition = 0; // স্ক্রোল পজিশন সেভ রাখার ভেরিয়েবল

        function processTestCode() {
            let rawInput = document.getElementById('jsonInput').value.trim();
            if (!rawInput) return alert("দয়া করে টেক্সট বক্সে কোড পেস্ট করুন!");

            let items = smartExtractMediaList(rawInput);

            if (items && items.length > 0) {
                renderGrid(items);
            } else {
                alert("কোনো ভ্যালিড মিডিয়া তথ্য পাওয়া যায়নি!");
            }
        }

        function smartExtractMediaList(rawText) {
            let results = [];
            let cleanText = rawText.trim();
            if (!cleanText.startsWith('[')) cleanText = '[' + cleanText;
            if (!cleanText.endsWith(']')) cleanText = cleanText + ']';
            cleanText = cleanText.replace(/,\s*([\]}])/g, '$1');

            try {
                let parsedJson = JSON.parse(cleanText);
                if (Array.isArray(parsedJson)) {
                    parsedJson.forEach((element, idx) => {
                        let type = "movie";
                        let name = element.title || element.name || `Item ${idx + 1}`;
                        let image = element.image || "";
                        let category = element.category || "";
                        let country = element.country || "";
                        let language = element.language || "";
                        let episodes = {};

                        if (element.type === "tv-channel" || element.CN) {
                            type = "tv-channel";
                            let channelData = element.CN ? Object.values(element.CN)[0] : {};
                            name = channelData.name || name;
                            image = element.image || channelData.tvglogo || "";
                            episodes["Live Stream"] = channelData.url || "";
                        } 
                        else if (element.episodes) {
                            type = "series";
                            episodes = element.episodes;
                        } 
                        else {
                            let videoUrl = element["Movie link"] || element.link || element.url || element.file;
                            if (videoUrl) episodes["Play Movie"] = videoUrl;
                        }

                        if (Object.keys(episodes).length > 0) {
                            results.push({
                                type,
                                name,
                                image,
                                category,
                                country,
                                language,
                                episodes,
                                rawElement: element
                            });
                        }
                    });
                }
            } catch (e) {
                alert("JSON কোডে ভুল আছে! দয়া করে সঠিক JSON পেস্ট করুন।");
            }

            return results;
        }

        function renderGrid(items) {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'media-grid';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openPlayerPage(item);
                card.innerHTML = `
                    <div class="card-image-wrapper">
                        <img src="${item.image}" onerror="this.src='https://via.placeholder.com/300x450?text=Poster'">
                    </div>
                    <div class="card-info">
                        <div class="card-title">${item.name}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
            mainContent.appendChild(grid);
        }

        function openPlayerPage(item) {
            // প্লেয়ার খোলার ঠিক আগে বর্তমান পেজের স্ক্রোল পজিশন সেভ করা হচ্ছে
            lastScrollPosition = window.scrollY || document.documentElement.scrollTop;

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'block';

            const sidebar = document.getElementById('playerSidebar');
            sidebar.innerHTML = '<h3 style="margin-bottom:10px; font-size:14px; color:#94a3b8;">Episodes / Sources</h3><div class="episodes-grid" id="epGrid"></div>';
            
            const epGrid = document.getElementById('epGrid');
            const epKeys = Object.keys(item.episodes);

            epKeys.forEach((indexKey, index) => {
                const btn = document.createElement('button');
                btn.className = 'ep-btn';
                btn.innerText = indexKey;
                btn.onclick = () => {
                    document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadVideo(item.episodes[indexKey], `${item.name} (${indexKey})`);
                    generateCodeBox(item, indexKey);
                };
                epGrid.appendChild(btn);
                if (index === 0) btn.click();
            });
        }

        function generateCodeBox(item, selectedEpKey) {
            let outputObject = {};

            if (item.type === "movie") {
                outputObject = {
                    "title": item.name,
                    "image": item.image,
                    "category": item.category,
                    "country": item.country,
                    "language": item.language,
                    "Movie link": item.episodes[selectedEpKey] || ""
                };
            } else if (item.type === "series") {
                outputObject = {
                    "name": item.name,
                    "image": item.image,
                    "category": item.category || "ANIMATION",
                    "country": item.country,
                    "language": item.language,
                    "episodes": item.episodes
                };
            } else if (item.type === "tv-channel") {
                outputObject = {
                    "type": "tv-channel",
                    "country": item.country || "Bangladesh",
                    "image": item.image,
                    "CN": {
                        "1": {
                            "name": item.name,
                            "tvglogo": item.image,
                            "group": item.category,
                            "url": item.episodes[selectedEpKey] || ""
                        }
                    }
                };
            }

            document.getElementById('currentCodeBox').value = JSON.stringify(outputObject, null, 2);
        }

        function copyCurrentCode() {
            const codeBox = document.getElementById('currentCodeBox');
            if (!codeBox.value) return alert('কপি করার মতো কোনো কোড নেই!');
            
            codeBox.select();
            document.execCommand('copy');
            alert('কোড সফলভাবে কপি হয়েছে!');
        }

        function loadVideo(url, title) {
            const iframe = document.getElementById('iframePlayer');
            const video = document.getElementById('html5Player');
            document.getElementById('videoTitle').innerText = title;

            if (hlsPlayer) {
                hlsPlayer.destroy();
                hlsPlayer = null;
            }

            let cleanUrl = (url || '').trim();

            if (cleanUrl.includes('drive.google.com')) {
                const match = cleanUrl.match(/\/d\/([^\/]+)/) || cleanUrl.match(/id=([^&]+)/);
                if (match && match[1]) {
                    cleanUrl = `https://drive.google.com/file/d/${match[1]}/preview`;
                }
            }

            const lowerUrl = cleanUrl.toLowerCase();

            if (lowerUrl.includes('.m3u8') || lowerUrl.includes('.mp4') || lowerUrl.includes('.mkv')) {
                iframe.style.display = 'none';
                iframe.src = '';
                video.style.display = 'block';

                if (lowerUrl.includes('.m3u8') && Hls.isSupported()) {
                    hlsPlayer = new Hls();
                    hlsPlayer.loadSource(cleanUrl);
                    hlsPlayer.attachMedia(video);
                    hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
                } else {
                    video.src = cleanUrl;
                    video.play().catch(() => {});
                }
            } else {
                video.style.display = 'none';
                video.pause();
                iframe.style.display = 'block';
                iframe.src = cleanUrl;
            }
        }

        function closePlayerPage() {
            document.getElementById('player-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            
            // পূর্বে সেভ করা স্ক্রোল পজিশনে ফিরিয়ে দেওয়া হচ্ছে
            window.scrollTo(0, lastScrollPosition);

            document.getElementById('iframePlayer').src = '';
            const video = document.getElementById('html5Player');
            video.pause();
            if (hlsPlayer) {
                hlsPlayer.destroy();
                hlsPlayer = null;
            }
        }
    </script>
</body>
</html>
